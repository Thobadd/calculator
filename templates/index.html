<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Calculator</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #121212;
        margin: 0;
        padding: 20px;
      }

      .calculator-container {
        background-color: #000000;
        width: 100%;
        max-width: 360px;
        height: 680px;
        border-radius: 32px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        border: 1px solid #222;
      }

      @media (orientation: landscape) {
        body {
          padding: 10px;
        }
        .calculator-container {
          max-width: 100%;
          height: 100vh;
          border-radius: 16px;
          padding: 16px;
        }
        .screen-container {
          min-height: 80px;
        }
        #input-preview {
          font-size: 0.95rem;
        }
        #screen {
          font-size: 2rem;
        }
        .grid-container {
          gap: 10px;
        }
        .row {
          gap: 10px;
        }
        .btn {
          width: 56px;
          height: 56px;
          font-size: 1.4rem;
        }
        .btn.sci-fn {
          height: 40px;
          font-size: 0.95rem;
        }
        .history-overlay {
          height: 90%;
        }
      }

      .screen-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        padding-bottom: 8px;
        min-height: 140px;
      }
      #input-preview {
        color: #888888;
        font-size: 1.2rem;
        margin-bottom: 8px;
        word-break: break-all;
        text-align: right;
        width: 100%;
        min-height: 1.5rem;
      }
      #screen {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 2.8rem;
        text-align: right;
        padding: 0;
        word-break: break-all;
      }

      .utility-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 4px;
        border-bottom: 1px solid #1a1a1a;
        margin-bottom: 16px;
      }
      .utility-left {
        display: flex;
        gap: 20px;
      }
      .util-btn {
        background: none;
        border: none;
        padding: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
        transition: opacity 0.2s;
      }
      .util-btn:hover {
        opacity: 1;
      }
      .util-btn svg {
        fill: #ffffff;
        width: 22px;
        height: 22px;
      }

      .mode-tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid #1a1a1a;
        padding-bottom: 10px;
      }
      .mode-tab {
        background: none;
        border: none;
        color: #888;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: color 0.2s;
      }
      .mode-tab.active {
        color: #2ed158;
      }

      .grid-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }

      .btn {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: none;
        font-size: 1.65rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: filter 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:active {
        filter: brightness(1.3);
      }

      .btn.dark {
        background-color: #1c1c1e;
        color: #ffffff;
      }
      .btn.operator {
        background-color: #2ed158;
        color: #000000;
        font-size: 1.9rem;
      }
      .btn.equal {
        background-color: #2f80ed;
        color: #000000;
        font-size: 1.9rem;
      }

      .history-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 75%;
        background-color: #1c1c1e;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        padding: 20px;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .history-overlay.open {
        transform: translateY(0);
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .history-header h3 {
        color: #ffffff;
        margin: 0;
        font-size: 1.2rem;
      }
      .clear-history-btn {
        background: none;
        border: none;
        color: #ff453a;
        font-size: 0.95rem;
        cursor: pointer;
        font-weight: 600;
      }
      .history-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .history-item {
        color: #e5e5ea;
        padding: 12px 6px;
        border-bottom: 1px solid #2c2c2e;
        font-size: 1.05rem;
        cursor: pointer;
        text-align: right;
        word-break: break-all;
      }
      .history-item:hover {
        background-color: #2c2c2e;
        border-radius: 8px;
      }

      .scientific-panel {
        display: none;
        background-color: #121212;
        padding: 10px;
        border-radius: 12px;
        margin-bottom: 10px;
        gap: 10px;
        grid-template-columns: repeat(4, 1fr);
      }
      .scientific-panel.open {
        display: grid;
      }
      .btn.sci-fn {
        background-color: #2c2c2e;
        color: #ff9f0a;
        font-size: 1.15rem;
        height: 48px;
        border-radius: 24px;
      }

      .converter-panel {
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      .converter-panel.open {
        display: flex;
      }
      .converter-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .converter-tab {
        background: none;
        border: none;
        color: #888;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .converter-tab.active {
        color: #2ed158;
        border-bottom: 2px solid #2ed158;
      }
      .input-group {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .input-group input {
        flex: 1;
        background: #1c1c1e;
        color: #fff;
        border: none;
        padding: 8px;
        border-radius: 8px;
      }
      .input-group select {
        background: #1c1c1e;
        color: #fff;
        border: none;
        padding: 6px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="calculator-container">
      <div class="screen-container">
        <div id="input-preview"></div>
        <input type="text" id="screen" readonly value="" placeholder="0" />
      </div>

      <div class="utility-row">
        <div class="utility-left">
          <button
            class="util-btn"
            type="button"
            onclick="toggleHistory()"
            title="View History"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
                fill="white"
              />
            </svg>
          </button>
          <button
            class="util-btn"
            type="button"
            onclick="toggleScientific()"
            title="Scientific Functions"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c0 1.1.9-2 2-2V5c0-1.1-.9-2-2-2zm-2 7h-2V8h2v2zm-4 0h-2V8h2v2zm-4 0H5V8h2v2zm0 4H5v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm2 3H5v-2h14v2z"
                fill="white"
              />
            </svg>
          </button>
        </div>
        <button
          class="util-btn"
          type="button"
          onclick="deleteLast()"
          title="Delete Last"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"
              fill="white"
            />
          </svg>
        </button>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" onclick="switchMode('calc')">
          Calculator
        </button>
        <button class="mode-tab" onclick="switchMode('converter')">
          Unit Converter
        </button>
      </div>

      <div class="scientific-panel" id="sci-drawer">
        <button class="btn sci-fn" onclick="press('sin(')">sin</button>
        <button class="btn sci-fn" onclick="press('cos(')">cos</button>
        <button class="btn sci-fn" onclick="press('tan(')">tan</button>
        <button class="btn sci-fn" onclick="press('π')">π</button>
        <button class="btn sci-fn" onclick="press('Rad(')">Rad</button>
        <button class="btn sci-fn" onclick="press('sqrt(')">√</button>
        <button class="btn sci-fn" onclick="press('ln(')">ln</button>
        <button class="btn sci-fn" onclick="press('log(')">log</button>
        <button class="btn sci-fn" onclick="press('1/')">1/x</button>
        <button class="btn sci-fn" onclick="press('x²')">x²</button>
        <button class="btn sci-fn" onclick="press('x^')">x^y</button>
        <button class="btn sci-fn" onclick="press('e^(')">e^x</button>
        <button class="btn sci-fn" onclick="press('abs(')">|x|</button>
      </div>

      <div class="converter-panel" id="converter-panel">
        <div class="converter-tabs">
          <button
            class="converter-tab active"
            onclick="switchConverter('area')"
          >
            Area
          </button>
          <button class="converter-tab" onclick="switchConverter('volume')">
            Volume
          </button>
          <button class="converter-tab" onclick="switchConverter('length')">
            Length
          </button>
          <button class="converter-tab" onclick="switchConverter('temp')">
            Temperature
          </button>
        </div>
        <div class="input-group">
          <input
            type="number"
            id="conv-input"
            placeholder="Enter value"
            oninput="convertUnits()"
          />
          <select id="conv-from" onchange="convertUnits()">
            <option value="ac">Acres</option>
            <option value="m2">Square meters</option>
          </select>
        </div>
        <div class="input-group">
          <input type="text" id="conv-output" readonly placeholder="Result" />
          <select id="conv-to" onchange="convertUnits()">
            <option value="m2">Square meters</option>
            <option value="ac">Acres</option>
          </select>
        </div>
      </div>

      <div class="grid-container" id="calc-grid">
        <div class="row">
          <button class="btn dark" onclick="clearScreen()">C</button>
          <button class="btn dark" onclick="press('(')">(</button>
          <button class="btn dark" onclick="press(')')">)</button>
          <button class="btn operator" onclick="press('/')">÷</button>
        </div>
        <div class="row">
          <button class="btn dark" onclick="press('7')">7</button>
          <button class="btn dark" onclick="press('8')">8</button>
          <button class="btn dark" onclick="press('9')">9</button>
          <button class="btn operator" onclick="press('*')">×</button>
        </div>
        <div class="row">
          <button class="btn dark" onclick="press('4')">4</button>
          <button class="btn dark" onclick="press('5')">5</button>
          <button class="btn dark" onclick="press('6')">6</button>
          <button class="btn operator" onclick="press('-')">−</button>
        </div>
        <div class="row">
          <button class="btn dark" onclick="press('1')">1</button>
          <button class="btn dark" onclick="press('2')">2</button>
          <button class="btn dark" onclick="press('3')">3</button>
          <button class="btn operator" onclick="press('+')">+</button>
        </div>
        <div class="row">
          <button
            class="btn dark"
            style="font-size: 1.3rem"
            onclick="toggleSign()"
          >
            +/−
          </button>
          <button class="btn dark" onclick="press('0')">0</button>
          <button class="btn dark" onclick="press('.')">.</button>
          <button class="btn equal" onclick="submitCalculation()">=</button>
        </div>
      </div>

      <div class="history-overlay" id="history-overlay">
        <div class="history-header">
          <h3>Calculation History</h3>
          <div style="display: flex; gap: 12px">
            <button class="clear-history-btn" onclick="clearHistory()">
              Clear
            </button>
            <button
              class="clear-history-btn"
              style="color: #2ed158"
              onclick="toggleHistory()"
            >
              Close
            </button>
          </div>
        </div>
        <ul class="history-list" id="history-items"></ul>
      </div>
    </div>

    <script>
      const screen = document.getElementById("screen");
      const inputPreview = document.getElementById("input-preview");
      const historyOverlay = document.getElementById("history-overlay");
      const historyItems = document.getElementById("history-items");
      const sciDrawer = document.getElementById("sci-drawer");
      const calcGrid = document.getElementById("calc-grid");
      const converterPanel = document.getElementById("converter-panel");

      let historyLog = JSON.parse(localStorage.getItem("calc_history")) || [];
      let currentMode = "calc";
      let currentConverter = "area";

      const conversions = {
        area: { ac: 4046.86, m2: 1 },
        volume: { l: 1, ml: 0.001 },
        length: { m: 1, km: 1000, cm: 0.01, mm: 0.001 },
        temp: null,
      };

      function switchMode(mode) {
        currentMode = mode;
        document
          .querySelectorAll(".mode-tab")
          .forEach((t) => t.classList.remove("active"));
        event.target.classList.add("active");

        if (mode === "calc") {
          calcGrid.style.display = "flex";
          converterPanel.style.display = "none";
          sciDrawer.classList.remove("open");
        } else {
          calcGrid.style.display = "none";
          converterPanel.style.display = "flex";
          sciDrawer.classList.remove("open");
        }
      }

      function switchConverter(type) {
        currentConverter = type;
        document
          .querySelectorAll(".converter-tab")
          .forEach((t) => t.classList.remove("active"));
        event.target.classList.add("active");

        const fromSelect = document.getElementById("conv-from");
        const toSelect = document.getElementById("conv-to");

        if (type === "area") {
          fromSelect.innerHTML =
            '<option value="ac">Acres</option><option value="m2">Square meters</option>';
          toSelect.innerHTML =
            '<option value="m2">Square meters</option><option value="ac">Acres</option>';
        } else if (type === "volume") {
          fromSelect.innerHTML =
            '<option value="l">Liters</option><option value="ml">Milliliters</option>';
          toSelect.innerHTML =
            '<option value="ml">Milliliters</option><option value="l">Liters</option>';
        } else if (type === "length") {
          fromSelect.innerHTML =
            '<option value="m">Meters</option><option value="km">Kilometers</option><option value="cm">Centimeters</option>';
          toSelect.innerHTML =
            '<option value="cm">Centimeters</option><option value="m">Meters</option><option value="km">Kilometers</option>';
        } else if (type === "temp") {
          fromSelect.innerHTML =
            '<option value="c">Celsius</option><option value="f">Fahrenheit</option>';
          toSelect.innerHTML =
            '<option value="f">Fahrenheit</option><option value="c">Celsius</option>';
        }
        convertUnits();
      }

      function convertUnits() {
        const input = parseFloat(document.getElementById("conv-input").value);
        if (isNaN(input)) {
          document.getElementById("conv-output").value = "";
          return;
        }

        const from = document.getElementById("conv-from").value;
        const to = document.getElementById("conv-to").value;
        let result;

        if (currentConverter === "temp") {
          if (from === "c" && to === "f") result = (input * 9) / 5 + 32;
          else if (from === "f" && to === "c") result = ((input - 32) * 5) / 9;
          else result = input;
        } else {
          const conv = conversions[currentConverter];
          result = (input * conv[from]) / conv[to];
        }

        document.getElementById("conv-output").value = result.toFixed(4);
      }

      function toggleHistory() {
        historyOverlay.classList.toggle("open");
      }

      function toggleScientific() {
        sciDrawer.classList.toggle("open");
      }

      function renderHistory() {
        historyItems.innerHTML = "";
        if (historyLog.length === 0) {
          historyItems.innerHTML =
            '<li style="color: #888; text-align: center; padding: 20px;">No calculation history</li>';
          return;
        }
        historyLog.forEach((item) => {
          const li = document.createElement("li");
          li.className = "history-item";
          li.innerText = item;
          li.onclick = () => {
            const parts = item.split(" = ");
            if (parts.length > 0) {
              screen.value = "";
              inputPreview.innerText = parts[0];
            }
            toggleHistory();
          };
          historyItems.appendChild(li);
        });
      }

      function press(value) {
        if (value === "*") inputPreview.innerText += "×";
        else if (value === "/") inputPreview.innerText += "÷";
        else inputPreview.innerText += value;
      }

      function clearScreen() {
        screen.value = "";
        inputPreview.innerText = "";
      }

      function deleteLast() {
        let current = inputPreview.innerText;
        if (
          current.endsWith("sin(") ||
          current.endsWith("cos(") ||
          current.endsWith("tan(")
        ) {
          inputPreview.innerText = current.slice(0, -4);
        } else if (
          current.endsWith("sqrt(") ||
          current.endsWith("Rad(") ||
          current.endsWith("e^(") ||
          current.endsWith("abs(")
        ) {
          inputPreview.innerText = current.slice(0, -5);
        } else if (current.endsWith("log(") || current.endsWith("ln(")) {
          inputPreview.innerText = current.slice(0, -4);
        } else {
          inputPreview.innerText = current.slice(0, -1);
        }
      }

      function toggleSign() {
        let current = inputPreview.innerText;
        if (current === "" || current === "0") return;
        if (current.startsWith("-")) {
          inputPreview.innerText = current.substring(1);
        } else {
          inputPreview.innerText = "-" + current;
        }
      }

      function clearHistory() {
        historyLog = [];
        localStorage.setItem("calc_history", JSON.stringify(historyLog));
        renderHistory();
      }

      function submitCalculation() {
        let expr = inputPreview.innerText;
        if (!expr) return;

        try {
          expr = expr
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/π/g, Math.PI)
            .replace(/sqrt/g, "Math.sqrt")
            .replace(/sin/g, "Math.sin")
            .replace(/cos/g, "Math.cos")
            .replace(/tan/g, "Math.tan")
            .replace(/ln/g, "Math.log")
            .replace(/log/g, "Math.log10")
            .replace(/e\^/g, "Math.exp")
            .replace(/x²/g, "**2")
            .replace(/x\^/g, "**")
            .replace(/abs/g, "Math.abs")
            .replace(/1\//g, "1/");
          let result = eval(expr);
          screen.value = result;

          const logEntry = inputPreview.innerText + " = " + result;
          historyLog.unshift(logEntry);
          if (historyLog.length > 20) historyLog.pop();
          localStorage.setItem("calc_history", JSON.stringify(historyLog));
          renderHistory();
        } catch (e) {
          screen.value = "Error";
        }
      }

      window.onload = function () {
        renderHistory();
      };
    </script>
  </body>
</html>
